<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>softtarget</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ccircle cx=%278%27 cy=%278%27 r=%276%27 fill=%27none%27 stroke=%27%23b4441f%27 stroke-width=%272.5%27/%3E%3Ccircle cx=%278%27 cy=%278%27 r=%272%27 fill=%27%23b4441f%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="mark">◎</span> softtarget <span class="sub">a deliberately vulnerable LLM app</span></div>
  <div class="status" id="status">checking model…</div>
</header>

<div class="shell">
  <nav class="labs" id="labs" aria-label="Labs"></nav>

  <main class="main">
    <section class="brief">
      <div class="brief-head">
        <div>
          <div class="owasp" id="owasp"></div>
          <h1 id="title"></h1>
        </div>
        <div class="levels" id="levels" role="radiogroup" aria-label="Security level"></div>
      </div>
      <p id="story"></p>
      <p class="goal"><b>Goal:</b> <span id="goal"></span></p>
      <div class="solved-banner" id="solvedBanner" hidden>Solved at this level.</div>
    </section>

    <section class="chat" id="chat" aria-live="polite"></section>

    <form class="composer" id="composer">
      <label class="composer-label" id="composerLabel" for="input">Message Pip</label>
      <textarea id="input" rows="2" placeholder="Type a message. Ctrl+Enter to send."></textarea>
      <div class="composer-actions">
        <button type="button" class="ghost" id="reset">Clear chat</button>
        <button type="submit" id="send">Send</button>
      </div>
    </form>
  </main>

  <aside class="side">
    <h2>What happened</h2>
    <div class="events" id="events"><p class="muted">Tool calls, filters and leaks show up here.</p></div>
    <h2>This level</h2>
    <details open><summary>Defence</summary><p id="defence"></p></details>
    <details><summary>Hint</summary><p id="hint"></p></details>
  </aside>
</div>

<div class="toast" id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
